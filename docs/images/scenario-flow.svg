<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1710" viewBox="0 0 1440 1710" role="img" aria-labelledby="title desc">
  <title id="title">Skytrace 시연 시나리오와 분석 흐름</title>
  <desc id="desc">질문 입력 후 가상 데이터 데모 또는 공개 원문 분석을 선택한다. 데모는 한국어, 중국어, 일본어, 영어의 가상 문서 4개와 주장 12개를 사용하며 API를 호출하지 않는다. 공개 원문 분석은 API 키 확인 후 LLM 검색어 생성, Tavily 검색과 본문 수집, LLM 주장 추출을 수행한다. 두 경로 모두 인용 대조와 사건, 표현 상태, 시간대, 단위 비교를 거쳐 보고서 초안을 만든다. 데모의 시작 시각은 일치하고 종료 시각은 상충하며, 고도는 근거 부족, 항공 영향은 직접 비교 불가로 표시한다. 분석가는 보고서를 승인하거나 보류하고, 항목 수정 또는 재검토 시 초안으로 돌아간다. 다운로드는 초안부터 가능하며 현재 상태와 검토 이력을 포함한다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#a49b88"/></marker>
    <style>
      text{font-family:Pretendard,"Malgun Gothic","Noto Sans CJK KR",sans-serif;fill:#eeeae0}
      .eyebrow{font-family:Consolas,monospace;font-size:17px;letter-spacing:2px;fill:#edbb66}
      .title{font-size:38px;font-weight:600}.heading{font-size:26px;font-weight:600}
      .body{font-size:21px}.small{font-size:18px}.muted{fill:#aaa79e}.accent{fill:#edbb66}
      .box{fill:#191916;stroke:#48453d;stroke-width:1.5}.focus{fill:#2b241a;stroke:#947343;stroke-width:1.5}
      .line{fill:none;stroke:#a49b88;stroke-width:2;marker-end:url(#arrow)}
      .guide{fill:none;stroke:#736b5c;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1440" height="1710" fill="#121210"/>
  <text x="60" y="50" class="eyebrow">SKYTRACE / SCENARIO FLOW</text>
  <text x="60" y="104" class="title">시연 시나리오와 분석 흐름</text>
  <text x="1380" y="100" text-anchor="end" class="small muted">구현 기준 2026-10-09</text>
  <path d="M60 125H1380" class="guide"/>

  <rect x="330" y="155" width="780" height="100" class="focus"/>
  <text x="720" y="193" text-anchor="middle" class="heading">01 / 질문 입력 · 분석 모드 선택</text>
  <text x="720" y="228" text-anchor="middle" class="small muted">가상 시험의 통제 시각 · 고도 제한 · 항공 영향은 일치하는가?</text>
  <path d="M720 255V282H365V310" class="line"/>
  <path d="M720 282H1075V310" class="line"/>

  <rect x="70" y="310" width="590" height="300" class="box"/>
  <text x="100" y="354" class="heading accent">02A / 가상 데이터 데모</text>
  <text x="100" y="390" class="body">고정 질문 + 고정 가상 문서</text>
  <text x="100" y="433" class="body">한국어 · 중국어 · 일본어 · 영어</text>
  <text x="100" y="468" class="body">문서 4개 / 주장 12개</text>
  <path d="M100 491H630" class="guide"/>
  <text x="100" y="527" class="small accent">검색 · 수집 · LLM API 호출 없음</text>
  <text x="100" y="562" class="small muted">D4는 D1의 영문 번역 → 같은 출처 그룹</text>
  <text x="100" y="590" class="small muted">실제 사건이나 실제 항행 자료가 아님</text>

  <rect x="780" y="310" width="590" height="300" class="box"/>
  <text x="810" y="354" class="heading">02B / 공개 원문 분석</text>
  <text x="810" y="390" class="small accent">OpenAI · Tavily 키 필요 / 실제 API 검증 별도</text>
  <text x="810" y="432" class="body">LLM 언어별 검색어 → Tavily URL 검색</text>
  <text x="810" y="468" class="body">Tavily 본문 수집 → LLM 주장 추출</text>
  <path d="M810 491H1340" class="guide"/>
  <text x="810" y="527" class="small muted">원문 · 한국어 번역 · 가능/추정/미확인 보존</text>
  <text x="810" y="562" class="small muted">본문 잘림 · 수집 실패 · 언어 미확보 기록</text>
  <text x="810" y="590" class="small accent">실패 시 가상 결과로 자동 대체하지 않음</text>

  <path d="M365 610V642H720V675" class="line"/>
  <path d="M1075 610V642H720" class="guide"/>
  <rect x="300" y="675" width="840" height="110" class="box"/>
  <text x="720" y="716" text-anchor="middle" class="heading">03 / 인용 대조 · 비교 전제 확인</text>
  <text x="720" y="751" text-anchor="middle" class="body muted">실제 문단의 구절인가? 같은 사건·대상·표현 상태인가?</text>
  <path d="M720 785V830" class="line"/>
  <rect x="300" y="830" width="840" height="95" class="box"/>
  <text x="720" y="869" text-anchor="middle" class="heading">04 / 시간대 · 단위 정규화와 값 비교</text>
  <text x="720" y="903" text-anchor="middle" class="small muted">날짜·시간대가 명시된 인용만 UTC 변환 / 서술형은 자동 확정하지 않음</text>

  <path d="M720 925V950H210V980" class="line"/>
  <path d="M720 950H550V980" class="line"/>
  <path d="M720 950H890V980" class="line"/>
  <path d="M720 950H1230V980" class="line"/>
  <rect x="60" y="980" width="300" height="175" class="box"/>
  <text x="85" y="1019" class="heading">통제 시작 / 일치</text>
  <text x="85" y="1055" class="body">23:00 KST · JST</text>
  <text x="85" y="1087" class="body">22:00 베이징</text>
  <text x="85" y="1128" class="body accent">모두 14:00 UTC</text>
  <rect x="400" y="980" width="300" height="175" class="focus"/>
  <text x="425" y="1019" class="heading accent">통제 종료 / 상충</text>
  <text x="425" y="1060" class="body">14:40 UTC</text>
  <text x="425" y="1092" class="body">14:20 UTC</text>
  <text x="425" y="1128" class="small muted">20분 차이 → 원문 검토</text>
  <rect x="740" y="980" width="300" height="175" class="box"/>
  <text x="765" y="1019" class="heading">고도 / 근거 부족</text>
  <text x="765" y="1060" class="body">FL200 / 한 출처만</text>
  <text x="765" y="1092" class="small muted">다른 출처의 미기재는</text>
  <text x="765" y="1128" class="small muted">반박이 아님</text>
  <rect x="1080" y="980" width="300" height="175" class="box"/>
  <text x="1105" y="1019" class="heading">영향 / 비교 불가</text>
  <text x="1105" y="1060" class="body">지연 가능성 ≠ 미확인</text>
  <text x="1105" y="1092" class="small muted">지연 미확인을</text>
  <text x="1105" y="1128" class="small muted">지연 없음으로 바꾸지 않음</text>
  <path d="M210 1155V1198H1230V1155M550 1155V1198M890 1155V1198" class="guide"/>
  <rect x="470" y="1166" width="500" height="27" fill="#121210"/>
  <text x="720" y="1185" text-anchor="middle" class="small accent">위 네 항목은 고정 가상 데모의 결과 예시</text>
  <path d="M720 1198V1220" class="line"/>
  <rect x="300" y="1220" width="840" height="95" class="focus"/>
  <text x="720" y="1259" text-anchor="middle" class="heading">05 / 근거 기반 보고서 초안</text>
  <text x="720" y="1293" text-anchor="middle" class="small muted">연결도 · UTC 비교 · 원문/번역 · 근거 충족도 · 미확정 사항</text>
  <path d="M720 1315V1335H500V1365" class="line"/>
  <path d="M720 1335H1200V1365" class="line"/>

  <rect x="80" y="1365" width="840" height="100" class="box"/>
  <text x="500" y="1405" text-anchor="middle" class="heading">06 / 분석가 검토</text>
  <text x="500" y="1441" text-anchor="middle" class="small muted">검토자 이름 · 근거 의견 입력 / 이름은 자기 기입이며 인증 아님</text>
  <rect x="1040" y="1365" width="320" height="100" class="box"/>
  <text x="1200" y="1405" text-anchor="middle" class="heading">보고서 다운로드</text>
  <text x="1200" y="1441" text-anchor="middle" class="small muted">초안부터 가능 / 상태·이력 포함</text>

  <path d="M500 1465V1490H205V1510" class="line"/>
  <path d="M500 1490V1510" class="line"/>
  <path d="M500 1490H790V1510" class="line"/>
  <rect x="80" y="1510" width="250" height="80" class="box"/>
  <text x="205" y="1543" text-anchor="middle" class="heading">승인</text>
  <text x="205" y="1574" text-anchor="middle" class="small muted">검토 기록 · 버전 갱신</text>
  <rect x="375" y="1510" width="250" height="80" class="box"/>
  <text x="500" y="1543" text-anchor="middle" class="heading">보류</text>
  <text x="500" y="1574" text-anchor="middle" class="small muted">사유 기록 · 버전 갱신</text>
  <rect x="660" y="1510" width="260" height="80" class="focus"/>
  <text x="790" y="1543" text-anchor="middle" class="heading accent">재검토 · 항목 수정</text>
  <text x="790" y="1574" text-anchor="middle" class="small muted">초안 복귀 / 재승인 필요</text>
  <path d="M790 1590V1620H30V1267H300" class="line"/>
  <text x="60" y="1672" class="small muted">신뢰도는 정답 확률이 아닌 근거 충족도입니다. 승인도 사실의 진위를 보증하지 않습니다.</text>
</svg>
