[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "skytrace-apac"
version = "0.1.0"
description = "Local multilingual evidence review MVP"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3",
  "openai>=1.82,<3", "tavily-python>=0.5,<1", "python-dotenv>=1,<2",
  "httpx>=0.27,<1",
  "langdetect==1.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*", "frame*", "analysis*"]

[tool.setuptools.package-data]
app = ["static/*", "prompts/*.txt", "prompts/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.cache/test-tmp"
cache_dir = ".cache/pytest"

[tool.ruff]
cache-dir = ".cache/ruff"
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
